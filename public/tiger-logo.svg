<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Tiger Gold/Orange Gradient -->
    <linearGradient id="tigerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>

    <!-- Eye Glow Gradient -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48cae4" />
      <stop offset="60%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#03045e" />
    </radialGradient>

    <!-- Metallic Gold Rim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#ffe6a7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="12" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#fb8500" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Cricket Seam Accents around Border -->
  <path d="M 60 160 C 90 100 160 50 256 50 C 352 50 422 100 452 160" fill="none" stroke="#d4af37" stroke-width="4" stroke-dasharray="8,6" opacity="0.4" />
  <path d="M 60 352 C 90 412 160 462 256 462 C 352 462 422 412 452 352" fill="none" stroke="#d4af37" stroke-width="4" stroke-dasharray="8,6" opacity="0.4" />

  <!-- TIGER FACE GROUP -->
  <g id="tiger-face" filter="url(#shadow)">
    <!-- Ears -->
    <!-- Left Ear Outer & Inner -->
    <polygon points="120,80 190,130 110,180" fill="url(#tigerGold)" stroke="#0f172a" stroke-width="4" />
    <polygon points="130,100 175,135 125,165" fill="#f8f9fa" opacity="0.9" />
    <!-- Right Ear Outer & Inner -->
    <polygon points="392,80 322,130 402,180" fill="url(#tigerGold)" stroke="#0f172a" stroke-width="4" />
    <polygon points="382,100 337,135 387,165" fill="#f8f9fa" opacity="0.9" />

    <!-- Tiger Crown / Forehead Main Shape -->
    <path d="M 170 120 L 256 160 L 342 120 L 380 200 L 410 260 L 360 310 L 340 370 L 256 410 L 172 370 L 152 310 L 102 260 L 132 200 Z"
          fill="url(#tigerGold)" stroke="#111827" stroke-width="5" />

    <!-- Cheeks (White Ruff fur) -->
    <polygon points="102,260 152,310 130,340 90,300" fill="#f8f9fa" stroke="#111827" stroke-width="3" />
    <polygon points="410,260 360,310 382,340 422,300" fill="#f8f9fa" stroke="#111827" stroke-width="3" />
    <polygon points="130,340 172,370 150,395 115,365" fill="#f8f9fa" stroke="#111827" stroke-width="3" />
    <polygon points="382,340 340,370 362,395 397,365" fill="#f8f9fa" stroke="#111827" stroke-width="3" />

    <!-- Tiger Center Stripes (Forehead) -->
    <!-- Center top stripe -->
    <polygon points="256,170 248,220 256,235 264,220" fill="#0f172a" />
    <!-- Center crown stripes -->
    <polygon points="256,125 240,155 256,160 272,155" fill="#0f172a" />
    <!-- Upper forehead bars -->
    <polygon points="205,150 245,185 240,195 195,160" fill="#0f172a" />
    <polygon points="307,150 267,185 272,195 317,160" fill="#0f172a" />
    <!-- Lower forehead side bars -->
    <polygon points="180,185 225,215 220,223 170,195" fill="#0f172a" />
    <polygon points="332,185 287,215 292,223 342,195" fill="#0f172a" />

    <!-- Cheek Stripes Left -->
    <polygon points="120,230 175,245 165,255 115,240" fill="#0f172a" />
    <polygon points="110,270 180,280 175,290 105,280" fill="#0f172a" />
    <polygon points="125,310 190,315 185,325 120,320" fill="#0f172a" />
    <!-- Cheek Stripes Right -->
    <polygon points="392,230 337,245 347,255 397,240" fill="#0f172a" />
    <polygon points="402,270 332,280 337,290 407,280" fill="#0f172a" />
    <polygon points="387,310 322,315 327,325 392,320" fill="#0f172a" />

    <!-- Eye Patches (White fur around eyes) -->
    <polygon points="170,225 225,230 220,265 160,255" fill="#ffffff" />
    <polygon points="342,225 287,230 292,265 352,255" fill="#ffffff" />

    <!-- EYES (Piercing Neon Cyan/Blue Tiger Eyes) -->
    <!-- Left Eye -->
    <polygon points="175,240 215,242 205,255 180,252" fill="#000000" />
    <polygon points="180,242 210,244 200,253 183,250" fill="url(#eyeGlow)" filter="url(#glow)" />
    <ellipse cx="196" cy="247" rx="3" ry="5" fill="#ffffff" />
    <!-- Right Eye -->
    <polygon points="337,240 297,242 307,255 332,252" fill="#000000" />
    <polygon points="332,242 302,244 312,253 329,250" fill="url(#eyeGlow)" filter="url(#glow)" />
    <ellipse cx="316" cy="247" rx="3" ry="5" fill="#ffffff" />

    <!-- Snout & Bridge of Nose -->
    <polygon points="238,240 274,240 282,310 230,310" fill="#fb8500" />
    <!-- White Muzzle Pads -->
    <path d="M 230 310 C 200 310 190 350 230 365 C 248 372 256 360 256 350 C 256 360 264 372 282 365 C 322 350 312 310 282 310 Z"
          fill="#f8f9fa" stroke="#0f172a" stroke-width="3" />

    <!-- Nose Triangle -->
    <polygon points="240,305 272,305 256,325" fill="#111827" />

    <!-- Whiskers Dots -->
    <circle cx="218" cy="335" r="2.5" fill="#0f172a" />
    <circle cx="228" cy="340" r="2.5" fill="#0f172a" />
    <circle cx="216" cy="346" r="2.5" fill="#0f172a" />
    <circle cx="294" cy="335" r="2.5" fill="#0f172a" />
    <circle cx="284" cy="340" r="2.5" fill="#0f172a" />
    <circle cx="296" cy="346" r="2.5" fill="#0f172a" />

    <!-- Mouth & Fangs -->
    <path d="M 230 355 Q 256 375 282 355" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" />
    <!-- Fangs -->
    <polygon points="225,355 233,355 229,368" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <polygon points="287,355 279,355 283,368" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <!-- Chin -->
    <polygon points="238,370 274,370 266,395 246,395" fill="#f8f9fa" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- BANNER WITH "NAQQASH" -->
  <g id="banner" filter="url(#shadow)">
    <!-- Banner Ribbon Background -->
    <path d="M 90 415 L 140 395 L 372 395 L 422 415 L 400 455 L 370 445 L 256 460 L 142 445 L 112 455 Z"
          fill="#111827" stroke="url(#goldRim)" stroke-width="4" />
    
    <!-- Banner Accent Line -->
    <path d="M 148 405 L 364 405" stroke="#fb8500" stroke-width="2" />

    <!-- NAQQASH Text -->
    <text x="256" y="438"
          text-anchor="middle"
          font-family="Impact, 'Arial Black', sans-serif"
          font-size="34"
          font-weight="900"
          letter-spacing="5"
          fill="#ffb703"
          stroke="#000000"
          stroke-width="1.5"
          filter="url(#glow)">NAQQASH</text>

    <!-- Subtitle: HAND CRICKET -->
    <text x="256" y="482"
          text-anchor="middle"
          font-family="'Segoe UI', Roboto, sans-serif"
          font-size="14"
          font-weight="800"
          letter-spacing="4"
          fill="#48cae4">HAND CRICKET LIVE</text>
  </g>
</svg>
